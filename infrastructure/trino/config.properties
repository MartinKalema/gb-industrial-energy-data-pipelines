# Single-node local Trino configuration.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static

# The accepted dbt design keeps reusable intermediate relations as views.
# Expanding the source-knowledge history graph requires 288 stages in the
# current correctness fixture, above Trino's default limit of 150. This local,
# isolated engine has no unrelated tenant queries, so allow the bounded full
# build without materializing hidden intermediate checkpoints.
query.max-stage-count=400
