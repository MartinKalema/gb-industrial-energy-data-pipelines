name: gb-industrial-energy

services:
  trino:
    image: trinodb/trino:478
    profiles: [query, batch]
    environment:
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_CATALOG_URI: ${R2_CATALOG_URI:?R2_CATALOG_URI is required}
      R2_CATALOG_WAREHOUSE: ${R2_CATALOG_WAREHOUSE:?R2_CATALOG_WAREHOUSE is required}
      R2_CATALOG_TOKEN: ${R2_CATALOG_TOKEN:?R2_CATALOG_TOKEN is required}
    ports:
      - "127.0.0.1:${TRINO_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/trino/config.properties:/etc/trino/config.properties:ro
      - ./infrastructure/trino/catalog:/etc/trino/catalog:ro
      - ./tests/smoke:/opt/industrial-energy/smoke:ro
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    mem_limit: 3g

  airflow:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    profiles: [batch]
    environment:
      AIRFLOW__API__HOST: 0.0.0.0
      AIRFLOW__API__PORT: 8080
      AIRFLOW__CORE__DAGS_FOLDER: /opt/industrial-energy/orchestration/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW_SIMPLE_AUTH_USERNAME: admin
      PIPELINE_WORK_ROOT: /opt/airflow/work
      PIPELINE_MAX_BATCH_DAYS: "31"
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_REGION: ${R2_REGION:-auto}
      R2_RAW_BUCKET: ${R2_RAW_BUCKET:?R2_RAW_BUCKET is required}
      R2_PIPELINE_PREFIX: ${R2_PIPELINE_PREFIX:-industrial-energy}
      TRINO_URL: http://trino:8080
      TRINO_USER: airflow
      TRINO_QUERY_TIMEOUT_SECONDS: "300"
      DBT_PROFILES_DIR: /opt/industrial-energy/transformations
      DBT_LOG_PATH: /opt/airflow/dbt/logs
      DBT_TARGET_PATH: /opt/airflow/dbt/target
      DBT_TRINO_HOST: trino
      DBT_TRINO_PORT: "8080"
      DBT_TRINO_USER: airflow
      DBT_TRINO_CATALOG: r2
      DBT_TRINO_SCHEMA: industrial_energy
      ICEBERG_CATALOG: r2
      ICEBERG_VALIDATED_SCHEMA: industrial_energy_validated
      TRINO_INSERT_BATCH_SIZE: "100"
      PYTHONPATH: /opt/industrial-energy
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    volumes:
      - .:/opt/industrial-energy:ro
      - airflow-state:/opt/airflow
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g

  spark-smoke:
    image: apache/spark:3.5.3
    profiles: [stream, smoke]
    user: "0:0"
    entrypoint: [/opt/spark/bin/spark-submit]
    command:
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1
      - /opt/industrial-energy/smoke/spark_streaming_append.py
    environment:
      R2_CATALOG_URI: ${R2_CATALOG_URI:?R2_CATALOG_URI is required}
      R2_CATALOG_WAREHOUSE: ${R2_CATALOG_WAREHOUSE:?R2_CATALOG_WAREHOUSE is required}
      R2_CATALOG_TOKEN: ${R2_CATALOG_TOKEN:?R2_CATALOG_TOKEN is required}
      SMOKE_RUN_ID: ${SMOKE_RUN_ID:-manual}
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python3
    volumes:
      - ./tests/smoke:/opt/industrial-energy/smoke:ro
      - spark-smoke-checkpoints:/opt/industrial-energy/checkpoints
      - spark-ivy-cache:/tmp/.ivy2
    mem_limit: 4g

volumes:
  airflow-state:
  spark-smoke-checkpoints:
  spark-ivy-cache:
