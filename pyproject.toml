[project]
name = "industrial-energy-lakehouse"
version = "0.1.0"
description = "Local-first industrial thermal-energy lakehouse portfolio project"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "clickhouse-connect==1.7.2",
  "fastapi==0.141.1",
  "jsonschema[format]>=4.23,<5",
  "trino==0.339.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "dbt-core==1.12.3",
  "dbt-trino==1.10.3",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = [
  "tests/contracts",
  "tests/api",
  "tests/generator",
  "tests/orchestration",
  "tests/pipeline",
]

[tool.uv]
package = false
