[project]
name = "industrial-energy-lakehouse"
version = "0.1.0"
description = "Local-first industrial thermal-energy lakehouse portfolio project"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "jsonschema[format]>=4.23,<5",
]

[dependency-groups]
dev = [
  "dbt-core==1.12.3",
  "dbt-trino==1.10.3",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = [
  "tests/contracts",
  "tests/generator",
  "tests/pipeline",
]

[tool.uv]
package = false
