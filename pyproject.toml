[project]
name = "industrial-energy-lakehouse"
version = "0.1.0"
description = "Local-first industrial thermal-energy lakehouse portfolio project"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = [
  "tests/contracts",
  "tests/generator",
]

[tool.uv]
package = false
